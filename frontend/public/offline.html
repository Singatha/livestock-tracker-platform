<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#075f38">
    <title>Flockwise is offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:#f7f6f0;color:#10271c;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:440px;background:#fff;border:1px solid #d9ded7;border-radius:20px;padding:36px;box-shadow:0 12px 35px #075f3814}.mark{width:48px;height:48px;border-radius:14px;background:#075f38;color:#fff;display:grid;place-items:center;font-weight:800}h1{font-size:28px;margin:24px 0 8px}p{color:#66736b;line-height:1.6;margin:0 0 24px}button{border:0;border-radius:10px;background:#075f38;color:#fff;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="mark">F</div><h1>You’re offline</h1><p>Flockwise needs a connection to load farm records securely. Reconnect, then try again.</p><button onclick="location.reload()">Try again</button></main></body>
